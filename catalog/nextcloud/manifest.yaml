apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: nextcloud
  name: "Nextcloud"
  description: "Files, calendar, contacts and office documents on your own machine. Sync clients for every platform; Nextcloud Office included via the recommended apps."
release:
  revision: "2"
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    app: application
    db: infrastructure
    redis: infrastructure
endpoints:
  web:
    service: app
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: secure
health:
  endpoint: web
  path: /status.php
  expectedStatus: [200]
  timeoutSeconds: 10
  deadlineSeconds: 600
ui:
  primaryEndpoint: web
provisionedCredentials:
  service: app
  usernameEnv: NEXTCLOUD_ADMIN_USER
  passwordEnv: NEXTCLOUD_ADMIN_PASSWORD
  username: admin
  note: "Sign in to Nextcloud as admin with this password, then change it under Personal settings → Security. Office, Calendar and Contacts are added on the first start."
# Decision 116: Nextcloud refuses hosts it does not trust and builds links from the request, so Harbor
# hands it every address it answers on (LAN, HTTPS LAN, tailnet, domains) and the proxies allowed to
# forward them, after every start, publish and unpublish. occ is Nextcloud's own admin tool.
hooks:
  afterStart:
    service: app
    user: www-data
    timeoutSeconds: 900
    command:
      - sh
      - -c
      - |
        cd /var/www/html || exit 1
        if ! php occ status 2>/dev/null | grep -q "installed: true"; then echo "Nextcloud is not installed yet"; exit 1; fi
        php occ config:system:delete trusted_domains >/dev/null
        i=0
        for d in $HARBOR_ADDRESSES; do php occ config:system:set trusted_domains "$i" --value="$d" >/dev/null || exit 1; i=$((i+1)); done
        php occ config:system:delete trusted_proxies >/dev/null
        i=0
        for p in $HARBOR_PROXIES; do php occ config:system:set trusted_proxies "$i" --value="$p" >/dev/null || exit 1; i=$((i+1)); done
        php occ config:system:delete overwritehost >/dev/null
        php occ config:system:delete overwriteprotocol >/dev/null
        if [ -n "$HARBOR_URL" ]; then php occ config:system:set overwrite.cli.url --value="${HARBOR_URL%/}" >/dev/null; fi
        if [ "$(php occ config:app:get harbor recommended 2>/dev/null)" != "done" ]; then
          ok=1
          for a in calendar contacts richdocuments richdocumentscode; do php occ app:install "$a" >/dev/null 2>&1 || php occ app:enable "$a" >/dev/null 2>&1 || ok=0; done
          if [ "$ok" = 1 ]; then php occ config:app:set harbor recommended --value=done >/dev/null; else echo "some recommended apps could not be installed yet; retried on the next start"; fi
        fi
        echo "trusted $i proxies, $(echo $HARBOR_ADDRESSES | wc -w) addresses"
storage:
  - id: html
    composeVolume: html
    purpose: "Nextcloud application, config and apps"
    retention: retain
  - id: db
    composeVolume: db
    purpose: "PostgreSQL database"
    retention: retain
  - id: data
    composeVolume: data
    purpose: "User files"
    retention: retain
    external: {hint: "A folder with room for everyone's files, for example /mnt/nextcloud-data. Nextcloud must own it; it takes ownership on first start."}
secrets:
  - id: database-password
    bytes: 32
    encoding: hex
    retention: retain
    bindings:
      - {service: db, environment: POSTGRES_PASSWORD}
      - {service: app, environment: POSTGRES_PASSWORD}
presentation:
  tagline: "Your files, calendar, contacts and office, at home"
  category: files
  icon: icon.svg
  developer: "Nextcloud GmbH and contributors"
  website: https://nextcloud.com
  releaseNotes: "Revision 2: works on every address at once (LAN, secure LAN, Tailscale, your domains); Harbor creates the admin login. Nextcloud 34.0.4 (Apache image) with PostgreSQL 17 and Redis; Nextcloud Office uses the built-in CODE server."
