apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: memos
  name: "Memos"
  description: "Lightweight, privacy-first note-taking: quick markdown memos with tags, search and a clean timeline."
release:
  revision: "1"
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 5230
    scheme: http
    exposure: direct
    browserContext: ordinary
health:
  endpoint: web
  path: /healthz
  expectedStatus: [200]
  timeoutSeconds: 5
  deadlineSeconds: 180
ui:
  primaryEndpoint: web
setup:
  endpoint: web
  instructions: "Open Memos and create the first account (it becomes the host/admin)."
storage:
  - id: data
    composeVolume: data
    purpose: "Notes, attachments and settings"
    retention: retain
presentation:
  tagline: "Quick notes that stay yours"
  category: productivity
  developer: "usememos"
  website: https://usememos.com
  releaseNotes: "Memos 0.30.0 with SQLite."
