apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: excalidraw
  name: Excalidraw
  description: Browser whiteboard
release:
  revision: "1"
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: secure
health:
  endpoint: web
  path: /
  expectedStatus: [200]
  timeoutSeconds: 5
  deadlineSeconds: 90
ui:
  primaryEndpoint: web
presentation:
  tagline: Whiteboard for quick sketches and diagrams
  category: productivity
  icon: icon.svg
  developer: Excalidraw contributors
  website: https://excalidraw.com
  releaseNotes: Static web image pinned by digest; drawings live in your browser and in exported files.
