apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: vaultwarden
  name: "Vaultwarden"
  description: "Lightweight password manager server compatible with the Bitwarden apps and browser extensions."
release:
  revision: "1"
deployment:
  compose: compose.yaml
  multiInstance: true
  services:
    web: application
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    browserContext: secure
health:
  endpoint: web
  path: /alive
  expectedStatus: [200]
  timeoutSeconds: 5
  deadlineSeconds: 180
ui:
  primaryEndpoint: web
setup:
  endpoint: web
  instructions: "Open the web vault and create your account. Afterwards consider disabling further sign-ups (see the README)."
storage:
  - id: data
    composeVolume: data
    purpose: "Vault database, attachments and icons cache"
    retention: retain
configuration:
  - {service: web, environment: DOMAIN, endpoint: web, format: origin}
presentation:
  tagline: "Your passwords, on your own server"
  category: security
  icon: icon.svg
  developer: "Vaultwarden contributors"
  website: https://github.com/dani-garcia/vaultwarden
  releaseNotes: "Vaultwarden 1.37.3 (alpine). Sign-ups are open until you turn them off."
